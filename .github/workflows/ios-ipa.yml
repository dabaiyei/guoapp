# 在云端 macOS runner 上构建未签名 IPA（红果鉴 / 真果鉴），并自动发布到 Releases
#
# 用法：
#   1. 把此文件放到仓库的 .github/workflows/ios-ipa.yml
#   2. Actions 页选 "Build iOS IPA" -> Run workflow，勾选需要的版本与是否发布
#   3. 构建产物在本次 run 的 Artifacts 里；勾选 publish 后同时出现在 Releases
#
# 说明：public 仓库的 macOS runner 不消耗付费额度。
# 未签名 IPA 需要自行签名才能装到 iPhone（Windows 上可用 Sideloadly / AltStore）。

name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      all_sources:
        description: '构建真果鉴（全部站源）。不勾选则构建仅红果的红果鉴'
        type: boolean
        default: false
      publish:
        description: '构建成功后发布到 Releases'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      edition: ${{ steps.meta.outputs.edition }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本与 edition
        id: meta
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.all_sources }}" = "true" ]; then
            echo "edition=zhenguojian" >> "$GITHUB_OUTPUT"
          else
            echo "edition=hongguojian" >> "$GITHUB_OUTPUT"
          fi

      # scripts/build_ios.py 用 go build -buildmode=c-archive 生成 DuanjuCore.xcframework
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      # pubspec.lock 已提交，脚本用 --enforce-lockfile，SDK 版本必须匹配
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 显示工具链
        run: |
          flutter --version
          go version
          xcodebuild -version
          pod --version || sudo gem install cocoapods

      - name: 构建（未签名 IPA + Runner.app zip）
        run: |
          python3 scripts/build_ios.py ${{ inputs.all_sources && '--all-sources' || '' }}

      - name: 校验产物
        run: |
          ls -lh dist/ios/
          cat dist/ios/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ steps.meta.outputs.edition }}
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: ios
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ipa-${{ needs.ios.outputs.edition }}
          path: dist

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          edition='${{ needs.ios.outputs.edition }}'
          version='${{ needs.ios.outputs.version }}'
          tag="ios-v${version//+/-}-${edition}"
          echo "发布 tag=$tag"
          ls -lh dist/
          {
            printf '%s\n\n' "版本 ${version}（${edition}）。未签名 IPA，需自行签名后才能安装。"
            printf '%s\n' "- *-ios-unsigned.ipa：未签名 IPA，用 AltStore / Sideloadly / TrollStore 自签后安装"
            printf '%s\n' "- *-ios-unsigned-app.zip：未签名 Runner.app，供自行签名 / 打包"
            printf '\n%s\n' "校验：SHA256SUMS.txt"
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "红果鉴 / 真果鉴 ${version} (iOS ${edition})" --notes-file notes.md
          else
            gh release create "$tag" dist/* --title "红果鉴 / 真果鉴 ${version} (iOS ${edition})" --notes-file notes.md
          fi
